name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clinicmind
          POSTGRES_PASSWORD: clinicmind
          POSTGRES_DB: clinicmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clinicmind:clinicmind@localhost:5432/clinicmind_test
      WEBHOOK_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q