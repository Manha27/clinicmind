services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clinicmind-db
    environment:
      POSTGRES_USER: clinicmind
      POSTGRES_PASSWORD: clinicmind
      POSTGRES_DB: clinicmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: